# Authorized public Android source and runner-owned QA on android/mobile-terminal.
# No signing material, raw logs or private profile data are retained; ARM64 candidate is unsigned.
# The approved synthetic UI PNGs and unsigned package are retained for one day.
# The tiny transport control remains available separately as --transport.
name: Android mobile KVM preview
on:
  push:
    branches: [android/mobile-terminal]
    paths:
      - .github/workflows/android-webview-kvm.yml
      - qa/android-webview-kvm/**
      - qa/android-mobile-terminal/**
      - android/**
      - src/**
      - lib/**
      - preset/**
      - development/**
      - tools/**
      - package.json
      - build-tools/package*.json
      - harness/package*.json
      - integrations/auth-webserver/**
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Read this QA branch
        # Official actions/checkout v4.3.1; tag/ref verified 2026-10-27.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Pinned public build Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
          check-latest: false
      - name: Run Android regressions, then exercise online memory in required KVM
        shell: bash
        env:
          NEXTTAVERN_UI_PHASE: memory
          NEXTTAVERN_UPGRADE_FROM_VERSION_CODE: '2'
          NEXTTAVERN_STANDARD_TOOL_QA: '1'
          NEXTTAVERN_UI_EVIDENCE_DIR: ${{ runner.temp }}/nexttavern-ui-images
        run: bash qa/android-webview-kvm/run-smoke.sh --mobile
      - name: Locate only the approved synthetic UI PNGs
        if: always()
        id: ui_images
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/nexttavern-ui-images/empty-provider.png" || -f "$RUNNER_TEMP/nexttavern-ui-images/ui-state.png" ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Retain approved synthetic UI images for one day
        if: always() && steps.ui_images.outputs.present == 'true'
        # Official actions/upload-artifact v4.6.2; tag verified 2026-10-27.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-synthetic-ui
          path: |
            ${{ runner.temp }}/nexttavern-ui-images/empty-provider.png
            ${{ runner.temp }}/nexttavern-ui-images/ui-state.png
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - name: Remove approved runner-local PNGs only
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/nexttavern-ui-images"

  arm64-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Read this Android branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Pinned public build Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
          check-latest: false
      - name: Build and statically check unsigned Android ARM64 APK
        shell: bash
        env:
          MOBILE_QA_WORK: ${{ runner.temp }}/nexttavern-arm64
          MOBILE_QA_ARM64_UNSIGNED: ${{ runner.temp }}/nexttavern-arm64-unsigned.apk
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:?}"
          export PATH="$JAVA_HOME/bin:$PATH"
          sdk="$RUNNER_TEMP/nexttavern-arm64-sdk"
          mkdir -p "$sdk/platforms" "$sdk/build-tools"
          cd "$sdk"
          curl -fsSL --retry 2 --retry-all-errors --connect-timeout 30 --max-time 300 https://dl.google.com/android/repository/platform-36_r02.zip -o platform.zip
          echo '2c1a80dd4d9f7d0e6dd336ec603d9b5c55a6f576  platform.zip' | sha1sum -c -
          curl -fsSL --retry 2 --retry-all-errors --connect-timeout 30 --max-time 300 https://dl.google.com/android/repository/build-tools_r36_linux.zip -o build-tools.zip
          echo 'b0b6376977657e8ad9b969bacf4093601da2c6fb  build-tools.zip' | sha1sum -c -
          mkdir platform-extract build-tools-extract
          unzip -q platform.zip -d platform-extract
          unzip -q build-tools.zip -d build-tools-extract
          mv platform-extract/* "$sdk/platforms/android-36"
          mv build-tools-extract/* "$sdk/build-tools/36.0.0"
          cd "$GITHUB_WORKSPACE"
          MOBILE_QA_SDK="$sdk" bash qa/android-mobile-terminal/run-mobile.sh prepare-arm64
          cd "$RUNNER_TEMP"
          sha256sum nexttavern-arm64-unsigned.apk > nexttavern-arm64-unsigned.sha256
      - name: Retain only the unsigned public-input candidate and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexttavern-arm64-unsigned
          path: |
            ${{ runner.temp }}/nexttavern-arm64-unsigned.apk
            ${{ runner.temp }}/nexttavern-arm64-unsigned.sha256
          compression-level: 0
          retention-days: 1
