name: pages

# Renders the documentation site in site/ from this repository's own Markdown
# and publishes it to GitHub Pages. The generator has no dependencies, needs no
# secrets and never touches the package: it only reads the documentation files
# that are already in the repository.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'README.md'
      - 'README.en.md'
      - 'ARCHITECTURE.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'FEEDBACK.md'
      - 'INSTALL-LINUX.md'
      - 'INSTALL-WINDOWS.md'
      - 'PUBLIC-ACCESS.md'
      - 'SCREENSHOTS.md'
      - 'images/**'
      - 'screenshots/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - name: Render the documentation site
        run: node site/build.mjs --out artifacts/site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
