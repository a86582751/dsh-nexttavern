# NextTavern amber tavern skin bundle patch: inserts its public dsh.client entry
# into the web plugin roster. The bundle is the official dsh plugin shape, so
# install it with `dsh plugin --profile <name> add <path-or-git-url>`. Mutual
# exclusion between skins is handled by the skin manager's disabled rows in the
# profile patch layer, never by this bundle layer.
- insert:
    - id: ui-skin-nexttavern
      name: dsh-nexttavern-amber
